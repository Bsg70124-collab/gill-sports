name: Gill Sports - Dashboard Smoke Test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'gill-sports-live-players.html'
      - 'featured-players.js'
      - 'github-actions-control.js'
      - 'model-quality-panel.js'
      - 'parlay-intelligence-panel.js'
      - 'phase4-control-panel.js'
      - 'phase4_control.py'
      - 'test_phase4_control.py'
      - 'data/phase4_control_center.json'
      - 'parlay_intelligence.py'
      - 'test_parlay_intelligence.py'
      - 'data/parlay_intelligence.json'
      - 'data/parlay_research_history.json'
      - 'mobile-app.js'
      - 'service-worker.js'
      - 'app.webmanifest'
      - 'gill-icon.svg'
      - 'apple-touch-icon.png'
      - 'data/model_quality_report.json'
      - 'data/parlay_research_previews.json'
      - '.github/workflows/gill-sports-dashboard-smoke-test.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify dashboard JavaScript syntax and required feed integrations
        shell: bash
        run: |
          python - <<'PYCODE'
          import json,re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html,re.I)
          if not scripts:raise SystemExit('DASHBOARD_SCRIPT_MISSING')
          Path('/tmp/gill-dashboard-check.js').write_text('\n'.join(scripts),encoding='utf8')
          ids=set(re.findall(r'\bid=["\']([^"\']+)["\']',html))
          jsrefs=set(re.findall(r"\$\(['\"]([^'\"]+)['\"]\)",'\n'.join(scripts)))
          missing=sorted(jsrefs-ids)
          if missing:raise SystemExit('MISSING_DOM_ELEMENTS: '+','.join(missing))
          required=['data/player_live.json','data/nba_market_comparison.json',
            'data/parlay_generation_status.json','parlay-size','market-table','market-feed-state',
            'setupTabRefresh','renderMarket','renderParlayResearch','parlay-research-list','renderFeedHealth','gs-auto-refresh','parlay-research-export','validated-edge-status','data/validated_player_edges.json','github-actions-control.js','model-quality-panel.js','mobile-app.js','parlay-intelligence-panel.js','phase4-control-panel.js','app.webmanifest','Refresh reloads saved data']
          absent=[x for x in required if x not in html]
          if absent:raise SystemExit('MISSING_DASHBOARD_INTEGRATIONS: '+','.join(absent))
          for name in ('data/player_live.json','data/nba_market_comparison.json',
                       'data/parlay_generation_status.json','data/parlay_research_previews.json','data/validated_player_edges.json','data/model_quality_report.json','data/parlay_intelligence.json','data/parlay_research_history.json','data/phase4_control_center.json','data/parlays.json'):
            json.loads(Path(name).read_text(encoding='utf8'))
          print('DASHBOARD_MARKUP_AND_FEEDS_OK',len(ids),'elements',len(jsrefs),'references')
          PYCODE
          node --check /tmp/gill-dashboard-check.js
          node --check featured-players.js
          node --check github-actions-control.js
          grep -q 'mobileMode' github-actions-control.js
          grep -q 'No job has been started by this button' github-actions-control.js
          node --check model-quality-panel.js
          node --check parlay-intelligence-panel.js
          node --check phase4-control-panel.js
          python -m unittest -v test_phase4_control.py
          python -m unittest -q test_parlay_intelligence.py
          node --check mobile-app.js
          grep -q 'gs-mobile-tabs' mobile-app.js
          grep -q 'gill-sports-last-tab-v2' mobile-app.js
          grep -q 'Open full-screen player projections' mobile-app.js
          grep -q 'apple-touch-icon.png' index.html
          test -s apple-touch-icon.png
          python - <<'PY'
          from pathlib import Path
          png=Path('apple-touch-icon.png').read_bytes()
          assert png[:8] == bytes([137,80,78,71,13,10,26,10]), 'Invalid PNG signature'
          assert 'player_live.json' not in Path('service-worker.js').read_text(), 'Do not cache player feeds'
          sw=Path('service-worker.js').read_text()
          assert 'uri.pathname.endsWith(".json")' in sw
          assert 'data/' in sw
          print('MOBILE_INSTALL_AND_NO_FEED_CACHE_OK')
          PY
          node --check service-worker.js
          python -m py_compile quality_audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          app=json.loads(Path('app.webmanifest').read_text())
          assert app['display']=='standalone'
          report=json.loads(Path('data/model_quality_report.json').read_text())
          assert report['counts']['settled']>=0
          slips=json.loads(Path('data/parlay_research_previews.json').read_text())
          for preview in slips.get('previews',[]):
            assert len({leg['game_id'] for leg in preview['legs']}) == preview['size']
            assert len({leg['player_id'] for leg in preview['legs']}) == preview['size']
            assert preview['validated_win_probability'] is None
            assert 'risk_flags' in preview
          intelligence=json.loads(Path('data/parlay_intelligence.json').read_text())
          history=json.loads(Path('data/parlay_research_history.json').read_text())
          assert intelligence['readiness']['verified_joint_calibration'] is False
          assert all(x['monte_carlo']['published_joint_win_probability'] is None for x in intelligence['preview_simulations'])
          assert all(x['classification']=='RESEARCH_ONLY_NOT_BETTABLE' for x in history['rows'])
          p4=json.loads(Path('data/phase4_control_center.json').read_text())
          assert p4['betting_gate']['verified_availability'] is False
          assert all(x['availability_verified'] is False for x in p4['injury_research_overlay']['player_rows'])
          assert 'historical_backtest' in p4
          print('MOBILE_QUALITY_AND_PARLAY_INVARIANTS_OK')
          PY
          grep -q 'github-actions-control.js' index.html
          grep -q 'workflow' github-actions-control.js
          echo DASHBOARD_JAVASCRIPT_SYNTAX_OK
