
name: Gill Sports Daily Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write

concurrency:
  group: gill-sports-daily-main
  cancel-in-progress: false

jobs:
  update-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run prediction model
        run: python workflow.py --lookback 75

      - name: Save updated predictions
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No prediction data changes."
            exit 0
          fi
          git commit -m "Automatic Gill Sports prediction update"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
