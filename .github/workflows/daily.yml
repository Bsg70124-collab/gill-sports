
name: Gill Sports Daily Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: write

jobs:
  update-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run prediction model
        run: python workflow.py --lookback 75

      - name: Save updated predictions
        run: |
          
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Automatic Gill Sports prediction update"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
