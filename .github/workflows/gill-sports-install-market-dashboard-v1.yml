name: Gill Sports - Install NBA Market Dashboard V1
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gill-sports-public-dashboard-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Add the market comparison panel
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64
          p=Path('gill-sports-live-players.html')
          if not p.exists():raise SystemExit('PLAYER_DASHBOARD_NOT_FOUND')
          s=p.read_text(encoding='utf-8')
          panel=base64.b64decode('').decode()
          style=base64.b64decode('').decode()
          script=base64.b64decode('').decode()
          if 'id="gill-market-panel"' not in s:
              if '</main>' not in s:raise SystemExit('MAIN_END_NOT_FOUND')
              s=s.replace('</main>',panel+'\n</main>',1)
          if 'id="gill-market-style-v1"' not in s:
              if '</head>' not in s:raise SystemExit('HEAD_END_NOT_FOUND')
              s=s.replace('</head>',style+'\n</head>',1)
          if 'id="gill-market-script-v1"' not in s:
              if '</body>' not in s:raise SystemExit('BODY_END_NOT_FOUND')
              s=s.replace('</body>',script+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          print('MARKET_DASHBOARD_INSTALLED:',p)
          print('PANEL_COUNT:',s.count('id="gill-market-panel"'))
          print('SCRIPT_COUNT:',s.count('id="gill-market-script-v1"'))
          PYCODE
      - name: Commit changed public page
        shell: bash
        run: |
          if git diff --quiet -- gill-sports-live-players.html; then
            echo 'Market panel already installed'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gill-sports-live-players.html
            git commit -m "Add NBA sportsbook market comparison panel"
            git push origin HEAD:main
          fi
