name: Gill Sports - Install Availability and News Dashboard
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gill-sports-dashboard-install
  cancel-in-progress: false
jobs:
  install-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Gill Sports
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Add unified injury and Yahoo headlines view
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path("gill-sports-live-players.html")
          text=p.read_text(encoding="utf-8")
          marker="GILL_AVAILABILITY_NEWS_V1_BEGIN"
          if marker in text:
              print("Availability/News already installed; leaving page unchanged")
              raise SystemExit(0)
          if text.count("</main><footer")!=1 or text.count("</body>")!=1:
              raise SystemExit("Expected dashboard HTML anchors not found; refusing to edit")
          panel='<!-- GILL_AVAILABILITY_NEWS_V1_BEGIN -->\n<section class="panel" id="availability-news-panel">\n  <h2>Player Availability &amp; News <span class="small">ESPN injuries + Yahoo Sports headlines</span></h2>\n  <p class="small">Injury labels are unofficial reporting signals, not confirmed active/inactive decisions. Headlines are links for review, not verified lineup changes. RotoWire automatic collection is not enabled.</p>\n  <div class="toolbar">\n    <input id="availability-search" aria-label="Search news and availability" placeholder="Search player or matchup">\n    <select id="availability-type" aria-label="Availability filter">\n      <option value="all">All candidates</option>\n      <option value="injury">ESPN injury reports</option>\n      <option value="out">Out / Doubtful reports</option>\n      <option value="news">Yahoo news matches</option>\n      <option value="unclear">No matching report</option>\n    </select>\n    <select id="availability-day" aria-label="Availability date"><option value="all">All forecast dates</option></select>\n    <button id="availability-update" type="button">Refresh availability</button>\n  </div>\n  <p class="small" id="availability-summary">Loading source data…</p>\n  <p class="small" id="availability-freshness"></p>\n  <div class="scroll"><table><thead><tr><th>Date</th><th>Player</th><th>Matchup</th><th>ESPN injury watch</th><th>Yahoo headlines</th></tr></thead>\n  <tbody id="availability-rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div>\n</section>\n<!-- GILL_AVAILABILITY_NEWS_V1_END -->\n'
          script='<script id="gill-availability-news-v1">\n'+base64.b64decode('').decode('utf-8')+'\n</script>\n'
          new=text.replace("</main><footer",panel+"</main><footer",1)
          new=new.replace("</body>",script+"</body>",1)
          assert new.count("GILL_AVAILABILITY_NEWS_V1_BEGIN")==1
          assert new.count("gill-availability-news-v1")==1
          assert new.count('id="availability-rows"')==1
          p.write_text(new,encoding="utf-8")
          print("Installed Availability & News panel; HTML length:",len(new))
          PY
      - name: Save updated live dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gill-sports-live-players.html
          if git diff --cached --quiet; then
            echo "Availability & News dashboard already present."
            exit 0
          fi
          git commit -m "Add combined Yahoo and ESPN player availability panel"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
